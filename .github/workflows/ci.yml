name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Test
        # No secrets in CI, so this also proves the demo path stays working.
        run: python -m pytest -q
      - name: App imports and renders headlessly
        run: |
          streamlit run app.py --server.headless true --server.port 8501 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:8501 >/dev/null && exit 0
            sleep 2
          done
          echo "app did not come up"; exit 1
